function fighterHTML(u,i,side){return `<button class="fighter ${battle[side+'Target']===i?'target':''}" data-fighter="${side}:${i}" ${u.hp<=0?'disabled':''}><div class="row"><span class="face">${D[u.id].emoji}</span><div style="text-align:right"><b>${D[u.id].name}</b><div class="small">${Math.max(0,u.hp)}/${u.max} HP</div></div></div><div class="meter"><span style="width:${Math.max(0,u.hp/u.max*100)}%;background:${side==='p'?'#70e6a2':'#ff8978'}"></span></div><div class="small muted">⚡ ${u.energy}/2 ${u.poison?'☠️':''} ${u.shield?'🛡️':''}</div></button>`}
function chatHTML(){let seed=chatMode==='world'?[['Ranger Nova','Welcome to the frontier!'],['System','World chat is a local preview.']]:chatMode==='alliance'?[['System','Alliance channels unlock with the online server.']]:[['System','Private messages require player accounts.']];return seed.concat(s.chat.filter(m=>m.mode===chatMode).map(m=>['You',m.text])).map(([name,t])=>`<div class="msg ${name==='You'?'me':''}"><b>${escapeHTML(name)}</b><div>${escapeHTML(t)}</div></div>`).join('')}
function escapeHTML(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function begin(){if(battle)return;let ids=s.team.filter(i=>s.dinos[i].unlocked);if(ids.length<3){notify('Unlock three dinosaurs first');return}let enemy=[0,2,1].map(i=>({id:i,max:Math.round(120+s.level*17),hp:Math.round(120+s.level*17),energy:0,shield:0,poison:0}));battle={p:ids.map(i=>({id:i,max:Math.round(100+s.dinos[i].lvl*30),hp:Math.round(100+s.dinos[i].lvl*30),energy:0,shield:0,poison:0})),e:enemy,pTarget:0,eTarget:0,turn:'p',round:1,log:['⚔️ The battle begins!']};tab='battle';render()}
function hit(u,dmg){let blocked=Math.min(u.shield,dmg);u.shield-=blocked;u.hp=Math.max(0,u.hp-(dmg-blocked));return dmg-blocked}
function fight(special){if(!battle||battle.turn!=='p')return;let a=battle.p[battle.pTarget],e=battle.e[battle.eTarget];if(!a||a.hp<=0){notify('Select a living dinosaur');return}if(!e||e.hp<=0){battle.eTarget=battle.e.findIndex(x=>x.hp>0);e=battle.e[battle.eTarget]}if(!e)return;if(special&&a.energy<2){notify('Need 2 energy for a special');return}let dmg=22+Math.floor(s.dinos[a.id].lvl*6);if(special){a.energy=0;switch(D[a.id].cls){case 'Guardian':a.shield+=55;battle.log.push('🛡️ '+D[a.id].name+' raises a 55-point shield!');break;case 'Assassin':dmg*=2;e.poison=2;break;case 'Support':battle.p.forEach(u=>u.hp=Math.min(u.max,u.hp+40));battle.log.push('🌿 Your team recovers 40 HP!');break;default:dmg=Math.round(dmg*2.2)}}else a.energy=Math.min(2,a.energy+1);let dealt=hit(e,dmg);battle.log.push(`${special?'✨':'🗡️'} ${D[a.id].name} hits ${D[e.id].name} for ${dealt}!`);if(battle.e.every(x=>x.hp<=0)){finish(true);return}battle.turn='e';render();setTimeout(()=>{if(!battle)return;for(let enemy of battle.e){if(enemy.hp<=0)continue;let living=battle.p.filter(u=>u.hp>0);if(!living.length)break;let target=living[Math.floor(Math.random()*living.length)];let dealt=hit(target,16+s.level*3+Math.floor(Math.random()*10));battle.log.push(`🔥 ${D[enemy.id].name} hits ${D[target.id].name} for ${dealt}`)}for(let u of [...battle.p,...battle.e])if(u.hp>0&&u.poison){hit(u,9);u.poison--;battle.log.push(`☠️ ${D[u.id].name} takes poison damage`)}if(battle.p.every(x=>x.hp<=0)){finish(false);return}if(battle.e.every(x=>x.hp<=0)){finish(true);return}battle.round++;battle.turn='p';if(battle.p[battle.pTarget].hp<=0)battle.pTarget=battle.p.findIndex(x=>x.hp>0);render()},520)}
function finish(win){battle=null;s.battles++;if(win){s.win++;s.xp+=30;earn(260,8);if(s.xp>=s.level*100){s.xp=0;s.level++;notify('🏆 Victory! Commander level up!')}else notify('🏆 Victory! +260 gold +8 gems')}else notify('Defeat — train your dinosaurs and try again');save();render()}
function modal(title,body,action){$('modal').classList.remove('hide');$('modal').innerHTML=`<div class="modal"><div class="big">🦖</div><h2>${title}</h2><p>${body}</p><div class="row" style="justify-content:center">${button('Close','close','ghost')}${action?button(action.label,action.id,'alt'):''}</div></div>`}
function doAction(act){if(act.startsWith('building:')){let id=act.split(':')[1],cost=s.buildings[id]*150;if(s.wood<cost||s.ore<Math.ceil(cost/2))return notify('Need wood and ore');s.wood-=cost;s.ore-=Math.ceil(cost/2);s.buildings[id]++;notify('🏗️ Building upgraded!');save();render();return}if(act==='gather'){s.wood+=160+s.buildings.hatchery*20;s.ore+=100+s.buildings.forge*15;notify('🌲 Supplies gathered!');save();render();return}if(act==='evolve'){let d=s.dinos[s.selected],cost=d.stars*45;if(!d.unlocked)return notify('Unlock this dinosaur first');if(d.stars>=5)return notify('Maximum evolution');if(s.essence<cost)return notify('Need more essence from expeditions');s.essence-=cost;d.stars++;notify('✨ Evolution complete!');save();render();return}if(act==='equip'){let d=s.dinos[s.selected],cost=(d.gear+1)*70;if(!d.unlocked)return notify('Unlock this dinosaur first');if(d.gear>=10)return notify('Maximum equipment tier');if(s.ore<cost)return notify('Need more ore');s.ore-=cost;d.gear++;notify('⚒️ Equipment enhanced!');save();render();return}if(act==='expedition'||act==='boss'){let boss=act==='boss',cost=boss?2:1,zoneLevel=[1,3,5][exploreZone];if(s.level<zoneLevel)return notify('Commander level '+zoneLevel+' required');if(s.energy<cost)return notify('Not enough energy');if(boss&&s.explore.steps%5!==0)return notify('Complete 5 encounters to unlock the boss');s.energy-=cost;let chance=Math.min(.94,.7+totalPower()/12000-(exploreZone*.1)-(boss?.12:0));if(Math.random()<chance){s.gold+=boss?800:150;s.wood+=boss?160:45;s.ore+=boss?130:35;s.essence+=boss?100:20;s.xp+=boss?65:20;if(boss)s.explore.bosses++;else s.explore.steps++;if(s.xp>=s.level*100){s.xp-=s.level*100;s.level++;}notify(boss?'👑 Boss defeated! Rare loot awarded':'🌿 Encounter won! Resources collected')}else notify('⚔️ Defeated! Train your dinosaurs and try again');save();render();return}if(act==='close'){$('modal').classList.add('hide');return}if(act==='base'){let c=s.base*500;if(s.gold<c)return notify('Not enough gold');s.gold-=c;s.base++;notify('🏰 Citadel upgraded!')}else if(act==='collect'){let now=Date.now();if(now-s.lastCollect<60000)return notify('Income available in '+Math.ceil((60000-(now-s.lastCollect))/1000)+'s');s.lastCollect=now;earn(s.lands.length*160);notify('🪙 Collected territory income!')}else if(act==='train'){let i=s.selected,c=180*s.dinos[i].lvl;if(s.gold<c)return notify('Not enough gold');s.gold-=c;s.dinos[i].lvl++;notify('⚡ '+D[i].name+' gained a level!')}else if(act==='unlock'){if(s.gems<180)return notify('Not enough gems');s.gems-=180;s.dinos[s.selected].unlocked=true;notify('🥚 Dinosaur unlocked!')}else if(act==='start'){begin();return}else if(act==='attack'){fight(false);return}else if(act==='special'){fight(true);return}else if(act==='retreat'){battle=null;notify('You retreated from battle')}else if(act==='gem250'){modal('Gem Cache','Preview only. Real-money purchases are not enabled.')}else if(act==='gold2000'){modal('Royal Treasury','Trade 120 demo gems for 2,000 gold?',{label:'Trade 120 💎',id:'buygold'});return}else if(act==='buygold'){if(s.gems<120)return notify('Not enough gems');s.gems-=120;s.gold+=2000;$('modal').classList.add('hide');notify('🪙 +2,000 gold')}else if(act==='egg'){modal('Ancient Egg','Unlock one random locked dinosaur for 180 demo gems.',{label:'Hatch 180 💎',id:'buyegg'});return}else if(act==='buyegg'){let locked=s.dinos.map((d,i)=>!d.unlocked?i:-1).filter(i=>i>=0);if(!locked.length)return notify('All dinosaurs unlocked!');if(s.gems<180)return notify('Not enough gems');s.gems-=180;let i=locked[Math.floor(Math.random()*locked.length)];s.dinos[i].unlocked=true;$('modal').classList.add('hide');notify('🥚 Hatched '+D[i].name+'!')}else if(act==='boost'){modal('Training Boost','Spend 140 demo gems to level up your selected dinosaur?',{label:'Train 140 💎',id:'buyboost'});return}else if(act==='buyboost'){if(s.gems<140)return notify('Not enough gems');s.gems-=140;s.dinos[s.selected].lvl++;$('modal').classList.add('hide');notify('⚡ Power increased!')}else if(act==='vip'||act==='pass'){modal('Coming Soon','This is a future monetization feature. No payment can be made in this prototype.');return}save();render()}
$('nav').addEventListener('click',e=>{let el=e.target.closest('[data-tab]');if(el){tab=el.dataset.tab;render()}});$('content').addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(el)return doAction(el.dataset.action);el=e.target.closest('[data-zone]');if(el){exploreZone=+el.dataset.zone;render();return}el=e.target.closest('[data-dino]');if(el){s.selected=+el.dataset.dino;save();render();return}el=e.target.closest('[data-region]');if(el){let i=+el.dataset.region;selectedRegion=i;if(s.lands.includes(i))return modal(REG[i][0],'👑 Your alliance controls this territory.');let neighbors=[i-3,i+3,...(i%3>0?[i-1]:[]),...(i%3<2?[i+1]:[])];if(!neighbors.some(x=>s.lands.includes(x)))return notify('Conquer an adjacent territory first');modal(REG[i][0],`Territory difficulty: ${fmt(450+REG[i][2]*450)} power. Capture costs 1 battle victory and requires at least ${fmt(450+REG[i][2]*450)} total power.`,{label:'Conquer ⚔️',id:'conquer'});return}el=e.target.closest('[data-fighter]');if(el&&battle){let [side,idx]=el.dataset.fighter.split(':');if(battle[side][+idx].hp>0){battle[side+'Target']=+idx;render()}return}el=e.target.closest('[data-chat]');if(el){chatMode=el.dataset.chat;render()}});$('modal').addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(!el)return;if(el.dataset.action==='conquer'){if(totalPower()<450+REG[selectedRegion][2]*450)return notify('Power too low — train dinosaurs!');if(!s.lands.includes(selectedRegion)){s.lands.push(selectedRegion);earn(300,15);notify('👑 Territory captured!')}doAction('close');render();return}doAction(el.dataset.action)});$('content').addEventListener('submit',e=>{if(e.target.id!=='chatForm')return;e.preventDefault();let input=$('chatInput'),value=input.value.trim();if(!value)return;s.chat.push({mode:chatMode,text:value.slice(0,160)});s.chat=s.chat.slice(-60);save();render()});
// Procedural 3D scene. All meshes are generated in-browser; no asset downloads besides Three.js.
let scene,camera,renderer,world,clock,models=[],particles=[];function setup3D(){if(!window.THREE){$('hero').insertAdjacentHTML('beforeend','<div style="position:absolute;inset:55px 0;text-align:center;padding:50px 20px;background:#102c39">3D engine unavailable. Connect to the internet and refresh.</div>');return}scene=new THREE.Scene();scene.background=new THREE.Color(0x183c4b);scene.fog=new THREE.Fog(0x183c4b,17,38);camera=new THREE.PerspectiveCamera(45,1,.1,100);camera.position.set(10,8,13);camera.lookAt(0,1,0);renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=false;$('hero').prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xb7f7ff,0x375c36,2.2));let light=new THREE.DirectionalLight(0xffe1a4,2.5);light.position.set(5,12,7);scene.add(light);world=new THREE.Group();scene.add(world);clock=new THREE.Clock();let down=null;renderer.domElement.addEventListener('pointerdown',e=>down=e.clientX);renderer.domElement.addEventListener('pointermove',e=>{if(down===null)return;world.rotation.y+=(e.clientX-down)*.008;down=e.clientX});['pointerup','pointercancel','pointerleave'].forEach(t=>renderer.domElement.addEventListener(t,()=>down=null));window.addEventListener('resize',resize);resize();let tick=()=>{requestAnimationFrame(tick);if(document.hidden)return;let time=clock.getElapsedTime();models.forEach((m,i)=>{m.position.y=m.userData.y+Math.sin(time*2+i)*.12;m.rotation.y=m.userData.r+Math.sin(time*.9+i)*.13;m.rotation.z=Math.sin(time*2.3+i)*.035});particles.forEach((p,i)=>{p.position.y=p.userData.y+Math.sin(time+i)*.25;p.rotation.y=time*.4});world.rotation.y+=.0018;renderer.render(scene,camera)};tick()}
function resize(){if(!renderer)return;let el=$('hero');let w=el.clientWidth,h=el.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.75,flatShading:true}),mesh=(geo,c,x,y,z,scale=[1,1,1],parent=world)=>{let m=new THREE.Mesh(geo,mat(c));m.position.set(x,y,z);m.scale.set(...scale);parent.add(m);return m},sphere=(c,x,y,z,sx,sy,sz,parent)=>mesh(new THREE.SphereGeometry(1,10,8),c,x,y,z,[sx,sy,sz],parent),cone=(c,x,y,z,r,h,parent)=>mesh(new THREE.ConeGeometry(r,h,6),c,x,y,z,[1,1,1],parent),box=(c,x,y,z,sx,sy,sz,parent)=>mesh(new THREE.BoxGeometry(1,1,1),c,x,y,z,[sx,sy,sz],parent);
function dinosaur(id,x,z,sz=1){let d=D[id],g=new THREE.Group();world.add(g);g.position.set(x,0,z);g.scale.setScalar(sz);g.userData={y:0,r:Math.random()*.3-.15};let c=d.color; sphere(c,0,1.12,0,.88,.62,.52,g);sphere(c,.75,1.5,0,.58,.46,.45,g);sphere(0xf9dfac,1.1,1.26,.03,.43,.2,.37,g);sphere(0xffffff,1.0,1.68,.37,.12,.14,.09,g);sphere(0xffffff,1.0,1.68,-.37,.12,.14,.09,g);sphere(0x122e3b,1.08,1.69,.43,.06,.08,.06,g);sphere(0x122e3b,1.08,1.69,-.43,.06,.08,.06,g);for(let zz of [-.38,.38]){sphere(c,-.4,.52,zz,.24,.55,.22,g);sphere(0x243e43,-.35,.15,zz,.32,.14,.3,g);sphere(c,.5,.85,zz,.18,.38,.15,g)}for(let i=0;i<4;i++){let t=cone(id===1?0xffefaa:0xe0b97d,-.58+i*.4,1.75-i*.1,0.22,.48,g);t.rotation.z=.35}for(let i=0;i<4;i++){let t=cone(c,-1.05-i*.34,1.05-i*.13,.31-i*.045,.65-i*.09,g);t.rotation.z=-1.25}if(id===1||id===4){for(let zz of [-.34,.34]){let horn=cone(0xf9edbc,1.13,1.9,zz,.16,.66,g);horn.rotation.z=-.4}}if(id===3){for(let i=0;i<4;i++){let t=cone(0x63e7ee,-.5+i*.33,2.05,.22,.85,g);t.rotation.z=.18}}models.push(g);return g}
function tree(x,z,s=1){let t=new THREE.Group();world.add(t);t.position.set(x,0,z);t.scale.setScalar(s);box(0x76563c,0,.6,0,.25,1.2,.25,t);for(let i=0;i<3;i++)cone([0x43ac78,0x6dd49a,0x2f876c][i],0,1.25+i*.35,0,.8-i*.16,1.1,t)}
function clear3D(){if(!world)return;while(world.children.length){let obj=world.children[0];world.remove(obj);obj.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){if(Array.isArray(o.material))o.material.forEach(m=>m.dispose());else o.material.dispose()}})}models=[];particles=[];world.rotation.y=0}
function update3D(){if(!world)return;clear3D();mesh(new THREE.CylinderGeometry(6.7,7.2,.6,9),0x306a59,0,-.35,0);mesh(new THREE.CylinderGeometry(6.3,6.3,.15,9),0x63b58a,0,0,0);if(sceneMode==='world'||sceneMode==='shop'||sceneMode==='alliance'||sceneMode==='base'){for(let i=0;i<9;i++){let a=i*Math.PI*2/9;tree(Math.cos(a)*5.4,Math.sin(a)*5.4,.65+Math.random()*.45)}box(0xbda57a,0,.5,-1.5,2,1,1.6);box(0xe6d39b,0,1.2,-1.5,1.35,.7,1.1);cone(0xe8a965,0,2,-1.5,1.2,1.1);for(let x of [-1.2,1.2]){box(0x9f8c6c,x,.85,-1.5,.55,1.7,.55);cone(0xffc66d,x,1.9,-1.5,.56,.8)}dinosaur(0,-2.6,1.3,.75);dinosaur(1,2.7,1.3,.8);dinosaur(2,.5,2.6,.65)}else if(sceneMode==='explore'){let palette=[0x61b88e,0x995743,0x9ccce5][exploreZone];mesh(new THREE.CylinderGeometry(5.8,6,.2,9),palette,0,.06,0);for(let i=0;i<8;i++){let a=i*Math.PI/4;if(exploreZone===0)tree(Math.cos(a)*4.8,Math.sin(a)*4.8,.7);else if(exploreZone===1){let rock=cone(0x7a4741,Math.cos(a)*4.8,.6,Math.sin(a)*4.8,.7,1.8);rock.rotation.z=.2}else cone(0xb9f4ff,Math.cos(a)*4.8,.7,Math.sin(a)*4.8,.5,1.7)}dinosaur([2,0,3][exploreZone],-1,0,1.2);dinosaur([1,4,5][exploreZone],2,1,.75)}else if(sceneMode==='dino'){dinosaur(s.selected,0,0,1.75);for(let i=0;i<8;i++){let a=i*Math.PI/4;let p=sphere(0xffd77a,Math.cos(a)*3,1.4+Math.sin(i)*.3,Math.sin(a)*3,.09,.09,.09);p.userData={y:p.position.y};particles.push(p)}}else{dinosaur(0,-2.5,0,.95);dinosaur(1,-2.5,2,.85);dinosaur(2,-2.5,-2,.8);dinosaur(3,2.5,0,.95);dinosaur(4,2.5,2,.85);dinosaur(5,2.5,-2,.8)} }
setInterval(()=>{if(s.energy<12){s.energy++;save();if(tab==='explore')render()}},120000);setup3D();render();})();
