<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dino Dominion — iPhone Playtest</title><style>
:root{color-scheme:dark;--bg:#091711;--card:#14271e;--edge:#315344;--gold:#e6c878;--mint:#b5ed9a;--muted:#a8c1b0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% 0,#284f36 0,transparent 45%),var(--bg);color:#f4f7e8;font:15px system-ui,-apple-system,sans-serif}main{max-width:1080px;margin:auto;padding:18px}h1{margin:0;color:var(--mint);font-size:clamp(27px,5vw,42px)}h2{margin:0 0 12px;color:var(--gold)}h3{margin:8px 0}p{line-height:1.5}.sub,.muted{color:var(--muted)}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.pill{border:1px solid var(--edge);background:#172e23;padding:8px 11px;border-radius:30px}.resources{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 20px}.tabs button{background:#1b3729;color:#c6d7c9}.tabs button.active{background:var(--mint);color:#102116}.panel{background:linear-gradient(150deg,#193427,#11241b);border:1px solid var(--edge);border-radius:18px;padding:17px;margin:13px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.card{background:#10241b;border:1px solid #365444;border-radius:14px;padding:13px}.dino{font-size:46px}.tag{display:inline-block;border-radius:20px;background:#294737;padding:4px 8px;font-size:12px;color:#cbe2cf}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:10px;background:var(--mint);color:#142517;font-weight:750;padding:11px 13px;cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}.secondary{background:#335443;color:white}.danger{background:#623b37;color:white}.selected{outline:2px solid var(--gold)}.log{height:180px;overflow:auto;background:#0b1b13;border-radius:12px;padding:10px;font-size:13px;line-height:1.5}.log div{border-bottom:1px solid #294134;padding:5px}.map{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.tile{min-height:115px;background:#244633;color:#f2f8eb;border:1px solid #53755a;text-align:left}.tile strong{display:block}.tile small{display:block;margin-top:8px;color:#d0e0c7}.tile.owned{background:#33562b;border-color:#a4d77c}.tile.rival{background:#4b302b;border-color:#a8796a}.bar{height:9px;background:#314337;border-radius:8px;overflow:hidden;margin:6px 0}.bar span{display:block;background:#99d57e;height:100%}.hidden{display:none}footer{color:#a9bcad;font-size:12px;margin:25px 0}#toast{min-height:24px;color:var(--gold)}@media(max-width:600px){main{padding:12px}.map{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{min-height:100px}.panel{padding:13px}}@media(max-width:600px){body{font-size:16px}button{min-height:48px;font-size:15px;touch-action:manipulation}.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.tabs button{padding:12px 5px;font-size:12px}.map{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{min-height:115px}.actions button{flex:1 1 40%}main{padding:12px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}}html{-webkit-text-size-adjust:100%}</style><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Dino Dominion"><meta name="theme-color" content="#091711"></head><body><main><header><div><h1>🦖 DINO DOMINION</h1><div class="sub">IPHONE PLAYTEST · The Fractured Wilds</div></div><div class="pill">🟢 Offline playable demo</div></header><div class="resources" id="resources"></div><nav class="tabs" id="tabs"></nav><div id="toast" aria-live="polite"></div><section id="home"></section><section id="roster" class="hidden"></section><section id="battle" class="hidden"></section><section id="world" class="hidden"></section><section id="alliance" class="hidden"></section><section id="events" class="hidden"></section><footer>Local simulation only. Enemy factions, alliance membership, map ownership and events are NOT connected to real players or servers. No purchases or real money.</footer></main><script>
'use strict';const SPEC=[{id:'raptor',name:'Velociraptor',role:'Assassin',emoji:'🦖',hp:82,atk:27,skill:'Rending Claw'},{id:'trike',name:'Triceratops',role:'Tank',emoji:'🦏',hp:155,atk:13,skill:'Shield Charge'},{id:'spino',name:'Spinosaurus',role:'Striker',emoji:'🐊',hp:105,atk:25,skill:'Tidal Fury'},{id:'para',name:'Parasaurolophus',role:'Support',emoji:'🦕',hp:100,atk:15,skill:'Restoring Call'},{id:'anky',name:'Ankylosaurus',role:'Tank',emoji:'🛡️',hp:170,atk:11,skill:'Iron Tail'},{id:'dilo',name:'Dilophosaurus',role:'Assassin',emoji:'☠️',hp:85,atk:29,skill:'Venom Strike'}];const TILES=[['Verdant Nest',1,'home'],['Mosswood',2,'neutral'],['Obsidian Gate',3,'rival'],['Sunken Basin',2,'neutral'],['Raptor Ridge',4,'rival'],['Ancient Spire',5,'rival'],['Fern Valley',3,'neutral'],['Ash Plains',5,'rival'],['Crown Crater',7,'rival']];const KEY='dino-dominion-v02';const initial=()=>({food:350,stone:220,gems:30,energy:10,maxEnergy:10,wins:0,losses:0,day:1,roster:[{id:'raptor',level:1},{id:'trike',level:1},{id:'para',level:1}],team:[0,1,2],base:{hatchery:1,mine:1,command:1},territories:[0],alliance:null,donations:0,points:0,claimed:[],battle:null,log:['Welcome, Commander. Your three dinosaurs are ready.']});let S;try{S=JSON.parse(localStorage.getItem(KEY))||initial();if(!Array.isArray(S.roster)||!Array.isArray(S.team))throw 0}catch{S=initial()}let tab='home';const $=id=>document.getElementById(id),sp=id=>SPEC.find(x=>x.id===id),unit=i=>{let d=S.roster[i],s=sp(d.id);return {...s,level:d.level,hp:s.hp+(d.level-1)*16,atk:s.atk+(d.level-1)*5,index:i}},save=()=>{localStorage.setItem(KEY,JSON.stringify(S));render()},msg=t=>{S.log.unshift(t);S.log=S.log.slice(0,50);$('toast').textContent=t},spend=(cost)=>Object.entries(cost).every(([k,v])=>S[k]>=v)&&Object.entries(cost).every(([k,v])=>(S[k]-=v,true));function view(t){tab=t;render()}function btn(label,fn,disabled=false,cls=''){return `<button ${disabled?'disabled':''} class="${cls}" data-act="${fn}">${label}</button>`}function render(){ $('resources').innerHTML=[['🍖','Food',S.food],['🪨','Stone',S.stone],['💎','Gems',S.gems],['⚡','Energy',S.energy],['🏆','Wins',S.wins]].map(x=>`<span class="pill">${x[0]} ${x[1]}: <b>${x[2]}</b></span>`).join('');$('tabs').innerHTML=[['home','🏠 Base'],['roster','🧬 Dinosaurs'],['battle','⚔️ Battle'],['world','🌍 World'],['alliance','🤝 Alliance'],['events','🎪 Events']].map(([id,n])=>`<button class="${tab===id?'active':''}" data-tab="${id}">${n}</button>`).join('');for(let id of ['home','roster','battle','world','alliance','events'])$(id).classList.toggle('hidden',id!==tab);
$('home').innerHTML=`<div class="panel"><h2>Commander's Base</h2><p>Expand your prehistoric outpost. Buildings increase daily production. Each day you can collect resources and restore energy.</p><div class="grid">${[['hatchery','🥚 Hatchery','Food / day',70],['mine','⛏️ Quarry','Stone / day',50],['command','🏰 Command Center','Energy capacity',2]].map(([k,n,desc,v])=>`<div class="card"><h3>${n} · Lv ${S.base[k]}</h3><p class="muted">${desc}: ${v*S.base[k]}</p>${btn(`Upgrade · ${S.base[k]*90} stone`,`upgrade:${k}`,S.stone<S.base[k]*90)}</div>`).join('')}</div><div class="actions" style="margin-top:14px">${btn('☀️ Collect next day','day')}</div></div><div class="panel"><h2>Field Report</h2><div class="log">${S.log.map(x=>`<div>${x.replaceAll('<','&lt;')}</div>`).join('')}</div></div>`;
$('roster').innerHTML=`<div class="panel"><h2>Dinosaur Collection (${S.roster.length})</h2><p>Choose exactly three dinosaurs for your battle team. Tap a dinosaur to add or remove it.</p><div class="grid">${S.roster.map((d,i)=>{let u=unit(i),sel=S.team.includes(i);return `<div class="card ${sel?'selected':''}"><div class="dino">${u.emoji}</div><h3>${u.name} <span class="tag">${u.role}</span></h3><p>Level ${u.level} · ❤️ ${u.hp} · ⚔️ ${u.atk}</p><p class="muted">Special: ${u.skill}</p><div class="actions">${btn(sel?'✓ On team':'Add to team',`team:${i}`,!sel&&S.team.length>=3,sel?'secondary':'')}${btn('Train · 65 food',`train:${i}`,S.food<65)}</div></div>`}).join('')}</div><p class="muted">Hatching costs 130 food. Duplicate species are allowed.</p>${btn('🥚 Hatch dinosaur · 130 food','hatch',S.food<130)}</div>`;
let b=S.battle;$('battle').innerHTML=`<div class="panel"><h2>3v3 Tactical RPG</h2><p>Each living ally acts once per round. Select an enemy target; basic attacks generate momentum, and skills spend it. Tanks shield, support heals, assassins poison, and strikers deal burst damage.</p>${b?`<p><b>${b.mode}</b> · Round ${b.round} · Momentum ${b.momentum}/6</p><div class="grid"><div class="card"><h3>Your Team</h3>${b.allies.map((u,i)=>`<p>${u.emoji} ${u.name} · HP ${Math.max(0,u.current)}/${u.hp}<div class="bar"><span style="width:${Math.max(0,100*u.current/u.hp)}%"></span></div></p>`).join('')}</div><div class="card"><h3>Enemy Team</h3>${b.enemies.map((u,i)=>`<p>${u.emoji} ${u.name} · HP ${Math.max(0,u.current)}/${u.hp}<div class="bar"><span style="width:${Math.max(0,100*u.current/u.hp)}%"></span></div></p>`).join('')}</div></div><p>Active dinosaur: <b>${b.allies[b.turn]?.name||'—'}</b></p><div class="actions">${b.enemies.map((e,i)=>btn(`Target ${i+1}: ${e.name}`,`target:${i}`,e.current<=0,i===b.target?'secondary':'' )).join('')}</div><div class="actions" style="margin-top:10px">${btn('⚔️ Basic attack','attack',!b.allies[b.turn]||b.allies[b.turn].current<=0)}${btn(`✨ ${b.allies[b.turn]?.skill||'Skill'} · 2 momentum`,'skill',b.momentum<2||!b.allies[b.turn]||b.allies[b.turn].current<=0)}</div>`:`<p>Team: ${S.team.map(i=>sp(S.roster[i].id).name).join(' · ')}</p><div class="actions">${btn('Explore: wild battle · 2 energy','start:wild',S.energy<2||S.team.length!==3)}${btn('Arena: simulated rival · 3 energy','start:arena',S.energy<3||S.team.length!==3)}</div>`}<div class="log" style="margin-top:12px">${(b?b.log:S.log).map(x=>`<div>${x.replaceAll('<','&lt;')}</div>`).join('')}</div></div>`;
$('world').innerHTML=`<div class="panel"><h2>Territory Map</h2><p>Capture neighboring sectors with your RPG squad. Controlled territories provide daily food. Rival faction defenses are simulated locally in this prototype.</p><div class="map">${TILES.map(([name,level,kind],i)=>{let own=S.territories.includes(i),near=[i-3,i+3,...(i%3?[i-1]:[]),...(i%3<2?[i+1]:[])].some(j=>S.territories.includes(j));return `<button class="tile ${own?'owned':kind==='rival'?'rival':''}" data-act="tile:${i}"><strong>${own?'🟢':kind==='rival'?'🔴':'🟡'} ${name}</strong><small>Lv ${level} · ${own?'Controlled':kind==='rival'?'Rival faction':'Unclaimed'}${!own&&!near?' · Locked':''}</small></button>`}).join('')}</div><p class="muted">Territory attacks cost 3 energy. Conquered sectors remain yours until future server-war rules are implemented.</p></div>`;
$('alliance').innerHTML=`<div class="panel"><h2>Alliance Hall</h2><p>${S.alliance?`Alliance: <b>${S.alliance}</b> · Contribution: ${S.donations}`:'You have not joined an alliance.'}</p><p>Alliance contributions earn event points. Membership and contributions are simulated, not networked.</p><div class="actions">${btn('Join Primeval Pact','join',!!S.alliance)}${btn('Donate 50 food','donate',!S.alliance||S.food<50)}</div></div>`;
$('events').innerHTML=`<div class="panel"><h2>Season 0: Rise of the Ancients</h2><p>Complete milestones to earn free premium currency. These are local demonstration objectives, not timed live-service events.</p>${[['wins','Win 3 battles',S.wins,3,15],['territory','Control 3 sectors',S.territories.length,3,20],['donations','Donate 100 alliance food',S.donations,100,15]].map(([k,label,val,goal,reward])=>`<div class="card" style="margin-bottom:10px"><b>${label}</b> · ${Math.min(val,goal)}/${goal}<div class="bar"><span style="width:${Math.min(100,val/goal*100)}%"></span></div>${btn(`Claim ${reward} gems`,`claim:${k}`,val<goal||S.claimed.includes(k))}</div>`).join('')}</div><div class="panel"><h2>Development tools</h2>${btn('Reset local save','reset',false,'danger')}</div>`;
 document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>view(el.dataset.tab));document.querySelectorAll('[data-act]').forEach(el=>el.onclick=()=>action(el.dataset.act));}
function action(a){let [cmd,arg]=a.split(':');if(cmd==='upgrade'){let cost=S.base[arg]*90;if(spend({stone:cost})){S.base[arg]++;if(arg==='command')S.maxEnergy+=2;msg('Building upgraded.')}}else if(cmd==='day'){S.day++;S.food+=70*S.base.hatchery+20*S.territories.length;S.stone+=50*S.base.mine;S.energy=S.maxEnergy;msg(`Day ${S.day}: resources collected and energy restored.`)}else if(cmd==='hatch'){if(spend({food:130})){let d=SPEC[Math.floor(Math.random()*SPEC.length)];S.roster.push({id:d.id,level:1});msg(`Hatched ${d.name}!`)}}else if(cmd==='train'){if(spend({food:65})){S.roster[+arg].level++;msg('Training complete.')}}else if(cmd==='team'){let i=+arg;if(S.team.includes(i))S.team=S.team.filter(x=>x!==i);else if(S.team.length<3)S.team.push(i)}else if(cmd==='join'){S.alliance='Primeval Pact';msg('Joined simulated alliance Primeval Pact.')}else if(cmd==='donate'){if(spend({food:50})){S.donations+=50;S.points+=5;msg('Alliance donation complete.')}}else if(cmd==='claim'){let obj={wins:[S.wins,3,15],territory:[S.territories.length,3,20],donations:[S.donations,100,15]}[arg];if(obj&&obj[0]>=obj[1]&&!S.claimed.includes(arg)){S.gems+=obj[2];S.claimed.push(arg);msg(`Claimed ${obj[2]} gems.`)}}else if(cmd==='start'){startBattle(arg)}else if(cmd==='tile'){let i=+arg;if(S.territories.includes(i)){msg('You already control this sector.')}else{let near=[i-3,i+3,...(i%3?[i-1]:[]),...(i%3<2?[i+1]:[])].some(j=>S.territories.includes(j));if(!near)msg('Capture an adjacent sector first.');else if(S.energy<3)msg('Not enough energy.');else if(S.team.length!==3)msg('Select three dinosaurs first.');else{startBattle('territory',i);tab='battle'}}}else if(cmd==='target'){S.battle.target=+arg}else if(cmd==='attack'||cmd==='skill'){battleAction(cmd==='skill')}else if(cmd==='reset'){if(confirm('Delete all Alpha 0.2 local progress?')){S=initial();msg('Save reset.')}}save()}
function startBattle(mode,tile){let cost=mode==='wild'?2:3;if(!spend({energy:cost}))return;let lv=mode==='territory'?TILES[tile][1]:mode==='arena'?Math.max(1,Math.floor(S.wins/2)+1):Math.max(1,Math.floor(S.wins/4)+1);let allies=S.team.map(i=>({...unit(i),current:unit(i).hp,shield:0,poison:0}));let enemies=[0,1,2].map((_,i)=>{let s=SPEC[(lv+i+(mode==='arena'?3:0))%SPEC.length];return {...s,level:lv,hp:s.hp+(lv-1)*13,atk:s.atk+(lv-1)*3,current:s.hp+(lv-1)*13,shield:0,poison:0}});S.battle={mode:mode==='territory'?`Territory: ${TILES[tile][0]}`:mode==='arena'?'Arena (AI rival)':'Wild Expedition',type:mode,tile,allies,enemies,round:1,turn:0,target:0,momentum:0,log:['Battle started! Select an enemy and choose an attack.']};msg('Battle started.')}function hit(attacker,defender,mult=1){let raw=Math.max(1,Math.round(attacker.atk*mult));let blocked=Math.min(defender.shield||0,raw);defender.shield=Math.max(0,(defender.shield||0)-blocked);defender.current=Math.max(0,defender.current-(raw-blocked));return raw-blocked}function battleAction(skill){let b=S.battle;if(!b)return;let a=b.allies[b.turn];if(!a||a.current<=0)return;if(skill&&b.momentum<2)return;let e=b.enemies[b.target];if(!e||e.current<=0)e=b.enemies.find(x=>x.current>0);if(!e)return;if(skill){b.momentum-=2;if(a.role==='Support'){let target=b.allies.filter(x=>x.current>0).sort((x,y)=>x.current/x.hp-y.current/y.hp)[0];let healed=Math.min(target.hp-target.current,Math.round(a.atk*2.2));target.current+=healed;b.log.unshift(`${a.name} used ${a.skill}: healed ${target.name} for ${healed}.`)}else if(a.role==='Tank'){a.shield+=Math.round(a.hp*.25);let damage=hit(a,e,1.1);b.log.unshift(`${a.name} used ${a.skill}: ${damage} damage and gained a shield.`)}else if(a.role==='Assassin'){let damage=hit(a,e,1.45);e.poison=2;b.log.unshift(`${a.name} used ${a.skill}: ${damage} damage and poisoned ${e.name}.`)}else{let damage=hit(a,e,1.9);b.log.unshift(`${a.name} used ${a.skill}: ${damage} burst damage.`)}}else{let damage=hit(a,e,1);b.momentum=Math.min(6,b.momentum+1);b.log.unshift(`${a.name} attacked ${e.name} for ${damage}.`)}if(b.enemies.every(x=>x.current<=0)){endBattle(true);return}nextTurn()}
function nextTurn(){let b=S.battle;let next=b.allies.findIndex((u,i)=>i>b.turn&&u.current>0);if(next>=0){b.turn=next;return}for(let e of b.enemies){if(e.current<=0)continue;if(e.poison>0){e.current=Math.max(0,e.current-7);e.poison--;b.log.unshift(`${e.name} took 7 poison damage.`);if(e.current<=0)continue}let target=b.allies.filter(x=>x.current>0).sort((a,c)=>a.current-c.current)[0];if(!target)break;let damage=hit(e,target,.72);b.log.unshift(`${e.name} struck ${target.name} for ${damage}.`)}if(b.allies.every(x=>x.current<=0)){endBattle(false);return}if(b.enemies.every(x=>x.current<=0)){endBattle(true);return}b.round++;b.turn=b.allies.findIndex(x=>x.current>0);b.target=b.enemies.findIndex(x=>x.current>0);b.log.unshift(`— Round ${b.round} —`)}function endBattle(win){let b=S.battle;if(win){S.wins++;S.food+=65;S.stone+=20;if(b.type==='territory'&&!S.territories.includes(b.tile))S.territories.push(b.tile);msg(`Victory! +65 food, +20 stone${b.type==='territory'?', territory captured':''}.`)}else{S.losses++;msg('Defeat! Train your squad and try again.')}S.battle=null}render();</script></body></html>
