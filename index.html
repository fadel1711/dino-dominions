 let lance=box(0xdcc691,.25,.73,.63,.065,1.85,.065,r);lance.rotation.z=-.28;cone(0xd9e4dd,.50,1.66,.63,.13,.37,r,5);
}
function dinosaur(id,x,z,sz=1,mounted=ridersEnabled){const d=D[id],g=new THREE.Group();world.add(g);g.position.set(x,0,z);g.scale.setScalar(sz);g.userData={y:0,r:Math.random()*.2-.1};
 const c=d.color,belly=id===2?0x64718b:0xc9ba99,highlight=id===0?0xe0ae76:0xb7dbbd;
 sphere(c,0,1.23,0,1.01,.59,.56,g);sphere(belly,.03,.92,0,.81,.24,.45,g);
 sphere(c,.86,1.59,0,.63,.51,.46,g);sphere(c,1.26,1.32,.01,.50,.23,.39,g);sphere(belly,1.22,1.15,.02,.44,.11,.35,g);
 for(let side of [-1,1]){
  sphere(0xfff5de,1.12,1.80,side*.36,.12,.14,.09,g);sphere(0x172d2b,1.18,1.80,side*.41,.06,.09,.05,g);
  sphere(c,-.48,.60,side*.4,.30,.64,.23,g);sphere(0x384b44,-.42,.11,side*.43,.34,.14,.32,g);
  sphere(c,.51,1.07,side*.45,.22,.39,.17,g);cone(0xe8dac0,1.33,1.12,side*.25,.08,.20,g,5)
 }
 // Thick tapering tail and raised plated spine.
 for(let i=0;i<5;i++){let t=sphere(c,-1.0-i*.35,1.18-i*.14,0,.47-i*.062,.28-i*.034,.29-i*.037,g);t.rotation.z=-.19}
 for(let i=0;i<4;i++){let spike=cone(id===3?0x5cbed4:highlight,-.70+i*.4,1.94-i*.02,0,.18, .45+(id===3?.48:0),g);spike.rotation.z=-.24}
 if(id===1||id===4){for(let zz of [-.35,.35]){let horn=cone(0xead5aa,1.01,2.07,zz,.15,.70,g);horn.rotation.z=-.32}}
 if(id===3){let sail=cone(0x458a91,-.28,2.15,0,.67,1.0,g,5);sail.rotation.z=-.25}
 if(id===5){sphere(0xdb97a5,-.1,1.91,0,.65,.21,.22,g)}
 // Leather riding saddle is cosmetic and only visible with riders enabled.
 if(mounted){sphere(0x573e33,-.16,1.80,0,.55,.18,.50,g);box(0xf4ca77,-.10,1.89,0,.56,.06,.51,g);knight(g,.62)}
 models.push(g);return g}
function sparkles(x,z,accent=0xffcd6d,n=8){for(let i=0;i<n;i++){let a=i/n*Math.PI*2,p=sphere(accent,x+Math.cos(a)*2,1.4+(i%3)*.25,z+Math.sin(a)*2,.065,.065,.065);p.userData={y:p.position.y};particles.push(p)}}
function clear3D(){if(!world)return;while(world.children.length){let obj=world.children[0];world.remove(obj);obj.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){if(Array.isArray(o.material))o.material.forEach(m=>m.dispose());else o.material.dispose()}})}models=[];particles=[];world.rotation.y=0}

 if(sceneMode==='world'||sceneMode==='base'||sceneMode==='shop'||sceneMode==='alliance'){

 }else if(sceneMode==='explore'){

  dinosaur([2,0,3][exploreZone],-1.5,0,1.1,false);dinosaur([1,4,5][exploreZone],2.1,1.5,.76);

 }else if(sceneMode==='dino'){

 }else{

  dinosaur(0,-2.7,0,.88);dinosaur(1,-2.6,2,.79);dinosaur(2,-2.6,-2,.80);dinosaur(3,2.7,0,.87);dinosaur(4,2.6,2,.78);dinosaur(5,2.6,-2,.78);sparkles(0,0,0xdac87d,8)
 }
}

window.DDGameCloudBridge={
 exportState:()=>JSON.parse(JSON.stringify(s)),
 freshState:()=>initial(),
 guestState:()=>{try{return JSON.parse(localStorage.getItem('dino-dominion-alpha04')||'null')||initial()}catch(e){return initial()}},
 importState(raw){
   if(!raw||typeof raw!=='object'||!Array.isArray(raw.dinos)||raw.dinos.length!==D.length)throw Error('Incompatible kingdom save');
   const next=Object.assign(initial(),JSON.parse(JSON.stringify(raw)));
   if(!Array.isArray(next.creatures))next.creatures=[];
   if(!next.buildings||typeof next.buildings!=='object')next.buildings={hatchery:1,forge:1,academy:1};
   if(!next.explore||typeof next.explore!=='object')next.explore={zone:0,steps:0,bosses:0};
   next.dinos.forEach(d=>{d.stars??=1;d.gear??=0});
   s=next;window.DDRPG?.normalize(s);battle=null;render();
 }
};
