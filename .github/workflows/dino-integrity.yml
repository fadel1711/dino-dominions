name: Dino Dominion Static Integrity
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current repository
        uses: actions/checkout@v4
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test audit tool
        run: node --test tools/dino-static-audit.test.mjs
      - name: Check committed game assets and JavaScript syntax
        run: node tools/dino-static-audit.mjs
